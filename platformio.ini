[env:central_unit]
build_src_filter = -<*> +<central_unit/>
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

[env:tag]
build_src_filter = -<*> +<tag/>
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200